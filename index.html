<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HelloBuyer ERP - Supermarket System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e4a76">
  <meta name="description" content="Simple supermarket ERP for HelloBuyer">
</head>
<body>
  <div class="app-container">
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
      <div class="login-card">
        <div class="logo-container">
          <h1>🛒 HelloBuyer</h1>
          <p>Supermarket ERP</p>
        </div>
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginBtn" class="btn-primary">Login</button>
        <p class="demo-hint">Demo: admin@hellobuyer.com / admin123</p>
      </div>
    </div>

    <!-- Main App -->
    <div id="appScreen" style="display: none;">
      <div class="header">
        <div class="logo">
          <span>🛒 HelloBuyer</span>
          <small>ERP</small>
        </div>
        <div class="nav-buttons">
          <button class="nav-btn" data-page="dashboard">📊 Dashboard</button>
          <button class="nav-btn" data-page="products">📦 Products</button>
          <button class="nav-btn" data-page="pos">💰 POS</button>
          <button class="nav-btn" data-page="reports">📈 Reports</button>
          <button class="nav-btn logout" id="logoutBtn">🚪 Logout</button>
        </div>
      </div>
      <div id="pageContent" class="main-content">
        <!-- Dynamic content loads here -->
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/offline.js"></script>
  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
  <script src="js/pos.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
